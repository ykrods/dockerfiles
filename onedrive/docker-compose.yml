---
version: '3'
services:
  onedrive:
    image: driveone/onedrive:latest
    restart: unless-stopped
    environment:
      - ONEDRIVE_DATA_DIR
      - ONEDRIVE_UID
      - ONEDRIVE_GID
    volumes:
      - onedrive_conf:/onedrive/conf
      - ${ONEDRIVE_DATA_DIR}:/onedrive/data
volumes:
  onedrive_conf:
